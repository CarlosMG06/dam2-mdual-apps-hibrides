<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>login AMS2</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }
    hr {
        margin: 20px 0;
    }
    label {
        display: inline-block;
        width: 150px;
    }
    input {
        width: 200px;
        padding: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    button {
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
    button:hover {
        background-color: #c6c6c6;
    }
</style>
<body>
    <h1>Login</h1>
    <label>Nom d'usuari:</label>
    <input type="text" id="usuari" required>
    <br><br>
    <label>Contrasenya:</label>
    <input type="password" id="contrasenya" required>
    <br><br>
    <button onclick="fer_login()">Login</button>
    <hr>
    <h1>Register</h1>
    <label>Correu electrònic:</label>
    <input type="email" id="reg_email" required>
    <br><br>
    <label>Nom d'usuari:</label>
    <input type="text" id="reg_usuari" required>
    <br><br>
    <label>Contrasenya:</label>
    <input type="password" id="reg_contrasenya_1" required>
    <br><br>
    <label>Confirmar contrasenya:</label>
    <input type="password" id="reg_contrasenya_2" required>
    <br><br>
    <button onclick="registra()">Registra</button>
    <script>
        let userInfo = [
            {
            email: "example@gmail.com",
            username: "exampleUser",
            password: "3x4mpl3P4ssw0rd"
            },
            {
            email: "hola@gmail.com",
            username: "ieti",
            password: "cordova"
            }
        ];
        
        function fer_login() {
            const username = document.getElementById('usuari').value;
            const password = document.getElementById('contrasenya').value;
            let user = null;
            for (let i = 0; i < userInfo.length; i++) {
                if (userInfo[i].username === username && userInfo[i].password === password) {
                    user = userInfo[i];
                    break;
                }
            }
            if (user) {
                alert("Login exitós");
            } else {
                alert("Login incorrecte");
            }
        }
        function registra() {
            const email = document.getElementById('reg_email').value;
            const username = document.getElementById('reg_usuari').value;
            const password = document.getElementById('reg_contrasenya_1').value;
            const confirmpassword = document.getElementById('reg_contrasenya_2').value;

            if (password !== confirmpassword) {
                alert("Error en les contrasenyes");
                return;
            }

            for (let i = 0; i < userInfo.length; i++) {
                if (userInfo[i].username === username || userInfo[i].email === email) {
                    alert("El nom o l'email ja existeix a la base de dades");
                    return;
                }
            }

            const newUser = {
                email: email,
                username: username,
                password: password
            };
            userInfo.push(newUser);
            console.log(userInfo);
            alert("Nou usuari registrat correctament");
        }
    </script>
</body>
</html>
